<!DOCTYPE html>
<html lang="en"> <!-- Changed from class="dark" to standard light mode -->

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geo Top - Premium Learning Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Cairo"', 'sans-serif'],
            display: ['"Inter"', '"Cairo"', 'sans-serif'],
          },
          colors: {
            'eden-bg': '#FFFFFF',
            'eden-card': '#F5F7FA',
            'eden-accent': '#007BFF',
            'eden-accent-hover': '#1B5EBD',
            't-primary': '#007BFF',
            't-border': 'rgba(0, 0, 0, 0.05)',
            primary: '#007BFF',
            dark: '#FFFFFF',
          },
          boxShadow: {
            'glow': '0 0 20px -5px rgba(0, 123, 255, 0.3)',
            'soft-lift': '0 10px 30px -10px rgba(0, 0, 0, 0.1)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --dot-color: rgba(255, 255, 255, 0.03);
      --ui-bg: #ffffff;
      --ui-surface: #ffffff;
      --ui-surface-soft: #f8fafc;
      --ui-border: #e2e8f0;
      --ui-text-primary: #0f172a;
      --ui-text-secondary: #475569;
      --ui-text-muted: #64748b;
      --ui-btn-hover: #1b5ebd;
      --hero-globe-opacity: 0.34;
      --hero-logo-opacity: 0.74;
      --hero-ring-opacity: 0.36;
      --hero-shadow-color: rgba(0, 123, 255, 0.23);
      --hero-star-opacity: 0.14;
      --footer-logo-opacity: 0.36;
      --footer-ring-opacity: 0.26;
    }

    .dark {
      --ui-bg: #000000;
      --ui-surface: #050505;
      --ui-surface-soft: #0b0b0b;
      --ui-border: #1f2937;
      --ui-text-primary: #f8fafc;
      --ui-text-secondary: #cbd5e1;
      --ui-text-muted: #94a3b8;
      --hero-globe-opacity: 0.56;
      --hero-logo-opacity: 0.88;
      --hero-ring-opacity: 0.55;
      --hero-shadow-color: rgba(0, 123, 255, 0.45);
      --hero-star-opacity: 0.22;
      --footer-logo-opacity: 0.48;
      --footer-ring-opacity: 0.34;
    }

    body {
      background-color: var(--ui-bg);
      color: var(--ui-text-primary);
      overflow-x: hidden;
    }

    html,
    body,
    #root {
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    #root::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .dark body {
      background-color: var(--ui-bg);
      color: var(--ui-text-primary);
    }

    .dark .bg-eden-bg {
      background-color: #000000 !important;
    }

    .dark .bg-eden-card {
      background-color: #0a0a0a !important;
    }

    .dark .bg-white {
      background-color: var(--ui-surface) !important;
    }

    .dark .bg-white\/95 {
      background-color: rgba(0, 0, 0, 0.95) !important;
    }

    .dark .bg-white\/90 {
      background-color: rgba(0, 0, 0, 0.9) !important;
    }

    .dark .bg-white\/80 {
      background-color: rgba(0, 0, 0, 0.8) !important;
    }

    .dark .bg-slate-50 {
      background-color: var(--ui-surface-soft) !important;
    }

    .dark .bg-slate-100 {
      background-color: #101010 !important;
    }

    .dark .bg-slate-200 {
      background-color: #161616 !important;
    }

    .dark .border-slate-100,
    .dark .border-slate-200,
    .dark .border-slate-300 {
      border-color: var(--ui-border) !important;
    }

    .dark .text-slate-900,
    .dark .text-slate-800 {
      color: var(--ui-text-primary) !important;
    }

    .dark .text-slate-700,
    .dark .text-slate-600 {
      color: var(--ui-text-secondary) !important;
    }

    .dark .text-slate-500,
    .dark .text-slate-400 {
      color: var(--ui-text-muted) !important;
    }

    .dark .placeholder\:text-slate-400::placeholder {
      color: var(--ui-text-muted) !important;
    }

    button:not(:disabled) {
      transition: filter 0.2s ease, box-shadow 0.2s ease;
    }

    button:not(:disabled):hover {
      filter: brightness(1.03);
      box-shadow: 0 10px 24px -16px rgba(0, 123, 255, 0.55);
    }

    button:not(:disabled):active {
      filter: brightness(0.98);
    }

    .bg-eden-dots {
      background-image: radial-gradient(#007BFF 1px, transparent 1px);
      opacity: 0.1;
      background-size: 32px 32px;
    }

    .bg-hero-aura {
      background: radial-gradient(circle at 50% -20%, rgba(0, 123, 255, 0.1), transparent 70%);
    }

    .paper-grain {
      filter: url(#noiseFilter);
      opacity: 0.02;
      pointer-events: none;
    }

    .bg-obsidian-glow {
      background: radial-gradient(circle at center, rgba(0, 123, 255, 0.05) 0%, transparent 80%);
      pointer-events: none;
    }

    .no-select {
      user-select: none;
    }

    .rtl {
      direction: rtl;
    }

    .hero-ambient-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
      perspective: 1400px;
      isolation: isolate;
    }

    .hero-ambient-stars {
      position: absolute;
      inset: -20%;
      opacity: var(--hero-star-opacity);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0, 123, 255, 0.8) 1px, transparent 1.8px),
        radial-gradient(circle at 74% 58%, rgba(0, 123, 255, 0.8) 1px, transparent 1.6px),
        radial-gradient(circle at 52% 78%, rgba(15, 23, 42, 0.8) 0.9px, transparent 1.5px);
      background-size: 210px 210px, 260px 260px, 180px 180px;
      animation: heroStarDrift 26s linear infinite;
    }

    .hero-globe-shell {
      position: relative;
      width: min(72vw, 760px);
      aspect-ratio: 1;
      border-radius: 9999px;
      transform-style: preserve-3d;
      opacity: var(--hero-globe-opacity);
      animation: heroGlobeFloat 13s ease-in-out infinite;
      box-shadow:
        inset -30px -24px 90px rgba(2, 6, 23, 0.55),
        inset 26px 14px 80px rgba(147, 197, 253, 0.18),
        0 38px 110px -60px var(--hero-shadow-color);
    }

    .hero-globe-map {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 28% 24%, rgba(191, 219, 254, 0.36), transparent 36%),
        radial-gradient(circle at 60% 66%, rgba(59, 130, 246, 0.3), transparent 52%),
        url("https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?auto=format&fit=crop&w=1600&q=80")
          center / 155% auto no-repeat;
      filter: saturate(1.2) contrast(1.08) brightness(0.86);
      animation: heroGlobeSpin 32s linear infinite;
    }

    .hero-globe-veil {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.2), transparent 38%),
        radial-gradient(circle at 70% 78%, rgba(2, 132, 199, 0.18), transparent 46%),
        linear-gradient(130deg, rgba(2, 6, 23, 0.2), transparent 40%, rgba(2, 6, 23, 0.28));
      mix-blend-mode: screen;
      animation: heroVeilPulse 8s ease-in-out infinite;
    }

    .hero-globe-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border: 1px solid rgba(0, 123, 255, var(--hero-ring-opacity));
      border-radius: 9999px;
      transform-origin: center;
      filter: drop-shadow(0 0 14px rgba(0, 123, 255, 0.24));
    }

    .hero-globe-ring--outer {
      width: 116%;
      height: 116%;
      transform: translate(-50%, -50%) rotateX(72deg) rotateZ(0deg);
      animation: heroRingSpinA 16s linear infinite;
    }

    .hero-globe-ring--inner {
      width: 96%;
      height: 96%;
      transform: translate(-50%, -50%) rotateY(74deg) rotateX(9deg) rotateZ(0deg);
      animation: heroRingSpinB 18s linear infinite reverse;
      opacity: 0.8;
    }

    .hero-logo-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36%;
      aspect-ratio: 1;
      transform: translate3d(-50%, -50%, 80px);
      transform-style: preserve-3d;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      backdrop-filter: blur(1.5px);
      animation: heroLogoOrbit 9s ease-in-out infinite;
    }

    .hero-logo-core-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: var(--hero-logo-opacity);
      mix-blend-mode: screen;
      filter:
        drop-shadow(0 0 20px rgba(0, 123, 255, 0.45))
        drop-shadow(0 0 44px rgba(59, 130, 246, 0.24));
      transform-style: preserve-3d;
      animation: heroLogoGyro 12s linear infinite;
    }

    .hero-ambient-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 30%, rgba(248, 250, 252, 0.62) 72%),
        linear-gradient(to bottom, rgba(248, 250, 252, 0.2), rgba(248, 250, 252, 0.72));
      z-index: 1;
    }

    .dark .hero-ambient-overlay {
      background:
        radial-gradient(circle at center, transparent 26%, rgba(2, 6, 23, 0.72) 72%),
        linear-gradient(to bottom, rgba(2, 6, 23, 0.2), rgba(2, 6, 23, 0.82));
    }

    @keyframes heroStarDrift {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(-26px, 24px, 0);
      }
    }

    @keyframes heroGlobeFloat {
      0%,
      100% {
        transform: translateY(0) rotateX(11deg);
      }
      50% {
        transform: translateY(-14px) rotateX(15deg);
      }
    }

    @keyframes heroGlobeSpin {
      from {
        background-position: center, center, 0% 50%;
      }
      to {
        background-position: center, center, 200% 50%;
      }
    }

    @keyframes heroVeilPulse {
      0%,
      100% {
        opacity: 0.78;
      }
      50% {
        opacity: 0.95;
      }
    }

    @keyframes heroRingSpinA {
      from {
        transform: translate(-50%, -50%) rotateX(72deg) rotateZ(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotateX(72deg) rotateZ(360deg);
      }
    }

    @keyframes heroRingSpinB {
      from {
        transform: translate(-50%, -50%) rotateY(74deg) rotateX(9deg) rotateZ(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotateY(74deg) rotateX(9deg) rotateZ(360deg);
      }
    }

    @keyframes heroLogoOrbit {
      0%,
      100% {
        transform: translate3d(-50%, -50%, 80px) rotateX(0deg);
      }
      25% {
        transform: translate3d(-48%, -51%, 100px) rotateX(6deg);
      }
      50% {
        transform: translate3d(-50%, -49%, 120px) rotateX(-6deg);
      }
      75% {
        transform: translate3d(-52%, -50%, 96px) rotateX(4deg);
      }
    }

    @keyframes heroLogoGyro {
      0% {
        transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg);
      }
      25% {
        transform: rotateY(95deg) rotateX(13deg) rotateZ(3deg);
      }
      50% {
        transform: rotateY(190deg) rotateX(-10deg) rotateZ(-3deg);
      }
      75% {
        transform: rotateY(280deg) rotateX(8deg) rotateZ(2deg);
      }
      100% {
        transform: rotateY(360deg) rotateX(0deg) rotateZ(0deg);
      }
    }

    .footer-ambient-scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1300px;
      overflow: hidden;
      z-index: 0;
      opacity: 0.9;
    }

    .footer-ambient-orb {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 9999px;
      border: 1px solid rgba(0, 123, 255, var(--footer-ring-opacity));
      filter: drop-shadow(0 0 18px rgba(0, 123, 255, 0.28));
      transform-origin: center;
    }

    .footer-ambient-orb--one {
      width: min(72vw, 720px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) rotateX(70deg);
      animation: footerRingSpinA 22s linear infinite;
    }

    .footer-ambient-orb--two {
      width: min(58vw, 560px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) rotateY(72deg) rotateX(6deg);
      animation: footerRingSpinB 18s linear infinite reverse;
    }

    .footer-logo-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(25vw, 260px);
      aspect-ratio: 1;
      transform: translate3d(-50%, -50%, 70px);
      transform-style: preserve-3d;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      animation: footerLogoOrbit 12s ease-in-out infinite;
    }

    .footer-logo-core-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: var(--footer-logo-opacity);
      mix-blend-mode: screen;
      filter:
        drop-shadow(0 0 18px rgba(0, 123, 255, 0.5))
        drop-shadow(0 0 45px rgba(56, 189, 248, 0.26));
      transform-style: preserve-3d;
      animation: footerLogoGyro 14s linear infinite;
    }

    @keyframes footerRingSpinA {
      from {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
      }
    }

    @keyframes footerRingSpinB {
      from {
        transform: translate(-50%, -50%) rotateY(72deg) rotateX(6deg) rotateZ(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotateY(72deg) rotateX(6deg) rotateZ(360deg);
      }
    }

    @keyframes footerLogoOrbit {
      0%,
      100% {
        transform: translate3d(-50%, -50%, 70px) rotateX(0deg);
      }
      50% {
        transform: translate3d(-50%, -53%, 105px) rotateX(7deg);
      }
    }

    @keyframes footerLogoGyro {
      0% {
        transform: rotateY(0deg) rotateX(0deg);
      }
      25% {
        transform: rotateY(90deg) rotateX(8deg);
      }
      50% {
        transform: rotateY(180deg) rotateX(-7deg);
      }
      75% {
        transform: rotateY(270deg) rotateX(6deg);
      }
      100% {
        transform: rotateY(360deg) rotateX(0deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-ambient-stars,
      .hero-globe-shell,
      .hero-globe-map,
      .hero-globe-veil,
      .hero-globe-ring,
      .hero-logo-core,
      .hero-logo-core-img,
      .footer-ambient-orb,
      .footer-logo-core,
      .footer-logo-core-img {
        animation: none !important;
      }
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <!-- SVG Noise Engine -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
